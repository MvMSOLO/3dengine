<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OWNER</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;background:#000;z-index:5;height:0}#bt{top:0}#bb{bottom:0}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#chat{position:fixed;left:2.2vw;bottom:calc(7vh + 10px);width:min(380px,40vw);z-index:6;font-size:13px;line-height:1.35;text-shadow:0 1px 3px #000;pointer-events:none}
#chat .l{background:rgba(0,0,0,.4);padding:2px 8px;margin-top:2px;border-radius:5px}#chat b{font-weight:700}
.l.VIP b{color:#ffd54a}.l.ADMIN b{color:#ff6a6a}.l.SYSTEM b,.l.SERVER b{color:#9ff}.l.PLAYER b{color:#dfe}
#ban,#ban2{position:fixed;left:50%;transform:translateX(-50%);z-index:6;opacity:0;transition:opacity .4s;text-align:center;pointer-events:none}
#ban{top:calc(7vh + 14px);background:rgba(0,0,0,.6);border:1px solid #fff5;padding:8px 22px;border-radius:8px;font-weight:700;letter-spacing:1px}
#ban2{top:20vh;font-size:clamp(20px,3.4vw,46px);font-weight:900;letter-spacing:.35em;text-shadow:0 0 30px #fff}
#panel{position:fixed;right:5vw;top:24vh;width:min(360px,38vw);z-index:6;opacity:0;background:linear-gradient(160deg,rgba(18,18,24,.92),rgba(4,4,8,.94));border:1px solid #fffa;border-radius:12px;padding:14px;box-shadow:0 0 40px #fff3,inset 0 0 30px #fff1;pointer-events:none;font-size:13px}
#panel .h{display:flex;gap:10px;align-items:center;border-bottom:1px solid #fff3;padding-bottom:10px}
#panel .av{width:42px;height:42px;border-radius:50%;background:#222 center/cover;border:2px solid #fff}
#panel .st{display:flex;gap:6px;margin:10px 0}#panel .st i{flex:1;font-style:normal;background:#fff1;border:1px solid #fff2;border-radius:6px;padding:6px;text-align:center;font-size:11px;color:#bbb}#panel .st b{display:block;color:#fff;font-size:16px}
#cmdbox{background:#000;border:1px solid #fff6;border-radius:7px;padding:9px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;min-height:20px}
#sug{margin-top:6px;opacity:0;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#aaa}#sug div{padding:3px 8px;border-radius:4px}#sug .on{background:#fff2;color:#fff}
#go{margin-top:10px;text-align:center;padding:8px;border-radius:7px;font-weight:800;letter-spacing:2px;background:#222;color:#aaa}
#ini{margin-top:10px;font-size:11px;letter-spacing:2px;opacity:0}#pbar{height:4px;background:#fff2;border-radius:3px;margin-top:5px;overflow:hidden}#prog{height:100%;width:0;background:#fff}
#emb{position:fixed;z-index:7;opacity:0;pointer-events:none;filter:drop-shadow(0 0 24px #fff8)}#emb svg{width:100%;height:100%;overflow:visible}
#gate{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;cursor:pointer}
#gate div,#again div{width:84px;height:84px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:32px;padding-left:6px;transition:.2s}
#gate:hover div,#again:hover div{background:#fff;color:#000}
#again{position:fixed;inset:0;z-index:19;display:none;place-items:center;cursor:pointer;background:rgba(0,0,0,.35)}
</style></head><body>
